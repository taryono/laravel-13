<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#overlayGrad)"/>

  <!-- Decorative geometric accents -->
  <circle cx="700" cy="80" r="140" fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="380" r="180" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Icon & Emblem -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="64" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Newspaper / Graduation icon -->
    <path d="M -24 -20 L 24 -20 A 4 4 0 0 1 28 -16 L 28 20 A 4 4 0 0 1 24 24 L -24 24 A 4 4 0 0 1 -28 20 L -28 -16 A 4 4 0 0 1 -24 -20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-18" y1="-10" x2="6" y2="-10" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="6" x2="18" y2="6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="14" x2="10" y2="14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Portal Branding Text -->
  <text x="400" y="295" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">PORTAL BERITA SEKOLAH</text>
  <text x="400" y="322" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="1">EDUPULSE SAAS</text>
</svg>